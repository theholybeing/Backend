<!DOCTYPE html>
<html>
<head>
    <title>Student CRUD App</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 20px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        ul {
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Add Student</h2>

    <input type="text" id="name" placeholder="Name">
    <input type="number" id="age" placeholder="Age">
    <input type="text" id="course" placeholder="Course">

    <button onclick="addStudent()">Add Student</button>

    <button onclick="loadStudents()">Show Students</button>

    <ul id="studentList"></ul>
</div>

<script>
const API_URL = "http://127.0.0.1:8000/students/";
let editingId = null; // Track student being edited

async function addStudent() {
    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const course = document.getElementById("course").value;

    if (!name || !age || !course) return alert("Fill all fields");

    let method = "POST";
    let url = API_URL;

    if (editingId) {
        method = "PUT";
        url += editingId;
    }

    const response = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, age: Number(age), course })
    });

    if (response.ok) {
        editingId = null; // reset editing
        document.getElementById("name").value = "";
        document.getElementById("age").value = "";
        document.getElementById("course").value = "";
        loadStudents();
        alert(editingId ? "Student Updated!" : "Student Added!");
    } else {
        alert("Error saving student");
    }
}

async function loadStudents() {
    const response = await fetch(API_URL);
    const students = await response.json();

    const list = document.getElementById("studentList");
    list.innerHTML = "";

    students.forEach(s => {
        const li = document.createElement("li");
        li.innerHTML = `
            ${s.name} (${s.course}) - Age ${s.age} 
            <button onclick="editStudent(${s.id}, '${s.name}', ${s.age}, '${s.course}')">Update</button>
            <button onclick="deleteStudent(${s.id})">Delete</button>
        `;
        list.appendChild(li);
    });
}

function editStudent(id, name, age, course) {
    editingId = id;
    document.getElementById("name").value = name;
    document.getElementById("age").value = age;
    document.getElementById("course").value = course;
}

async function deleteStudent(id) {
    const confirmDelete = confirm("Are you sure you want to delete?");
    if (!confirmDelete) return;

    const response = await fetch(API_URL + id, { method: "DELETE" });
    if (response.ok) loadStudents();
}

</script>
</body>
</html>
